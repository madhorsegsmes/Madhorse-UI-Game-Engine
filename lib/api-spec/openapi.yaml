openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /mad-builder/plan:
    post:
      operationId: planMadBuilder
      tags: [mad-builder]
      summary: Plan an editable scene build using safe engine tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MadBuilderInput"
      responses:
        "200":
          description: Validated scene construction plan, not executable code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MadBuilderPlan"
        "400":
          description: Invalid request
        "403":
          description: Cross-site browser requests are not allowed
        "429":
          description: Builder is busy or request limit reached
        "502":
          description: AI could not produce a valid plan
        "503":
          description: AI connection unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MadBuilderInput:
      type: object
      required: [prompt, selectedName, assets]
      properties:
        prompt: { type: string, minLength: 3, maxLength: 2000 }
        selectedName: { type: string, maxLength: 80 }
        assets:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/BuilderAsset" }
    BuilderAsset:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 160 }
        kind: { type: string, enum: [image, model] }
    BuilderVector:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: -20, maximum: 20 }
        y: { type: number, minimum: -20, maximum: 20 }
        z: { type: number, minimum: -20, maximum: 20 }
    BuilderRotation:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: -180, maximum: 180 }
        y: { type: number, minimum: -180, maximum: 180 }
        z: { type: number, minimum: -180, maximum: 180 }
    BuilderSize:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: 0.02, maximum: 10 }
        y: { type: number, minimum: 0.02, maximum: 10 }
        z: { type: number, minimum: 0.02, maximum: 10 }
    BuilderPart:
      type: object
      required: [key, parentKey, kind, name, position, rotation, size, color]
      properties:
        key: { type: string, minLength: 1, maxLength: 40 }
        parentKey: { type: [string, "null"], maxLength: 40 }
        kind:
          type: string
          enum: [group, box, plane, terrain, sprite, model, light, camera, ui-panel, ui-text, ui-button, ui-health]
        name: { type: string, minLength: 1, maxLength: 80 }
        position: { $ref: "#/components/schemas/BuilderVector" }
        rotation: { $ref: "#/components/schemas/BuilderRotation" }
        size: { $ref: "#/components/schemas/BuilderSize" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        opacity: { type: number, minimum: 0.05, maximum: 1 }
        assetId: { type: [string, "null"], maxLength: 80 }
        text: { type: string, maxLength: 80 }
        lightKind: { type: string, enum: [point, directional, ambient] }
        intensity: { type: number, minimum: 0, maximum: 50 }
        fov: { type: number, minimum: 10, maximum: 100 }
    MadBuilderPlan:
      type: object
      required: [title, summary, warnings, parts]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        summary: { type: string, minLength: 1, maxLength: 800 }
        warnings:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 240 }
        parts:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/BuilderPart" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

