openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: multiplayer
    description: Temporary multiplayer rooms and lightweight play-test state sync
paths:
  /mad-builder/plan:
    post:
      operationId: planMadBuilder
      tags: [mad-builder]
      summary: Plan an editable scene build using safe engine tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MadBuilderInput"
      responses:
        "200":
          description: Validated scene construction plan, not executable code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MadBuilderPlan"
        "400":
          description: Invalid request
        "403":
          description: Cross-site browser requests are not allowed
        "429":
          description: Builder is busy or request limit reached
        "502":
          description: AI could not produce a valid plan
        "503":
          description: AI connection unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /multiplayer/sessions:
    post:
      operationId: createMultiplayerSession
      tags: [multiplayer]
      summary: Host a temporary multiplayer room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiplayerPlayerInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiplayerSessionMember"
        "400":
          description: Invalid player name
  /multiplayer/sessions/{code}/join:
    post:
      operationId: joinMultiplayerSession
      tags: [multiplayer]
      summary: Join a room using its invite code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z2-9]{6}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiplayerPlayerInput"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiplayerSessionMember"
        "400":
          description: Invalid player name or room code
        "404":
          description: Room not found or full
  /multiplayer/sessions/{code}/state:
    get:
      operationId: getMultiplayerSessionState
      tags: [multiplayer]
      summary: Read the room roster, synchronized objects, and recent events
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z2-9]{6}$"
      security:
        - MultiplayerSession: []
      responses:
        "200":
          description: Current room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiplayerSessionState"
        "401":
          description: Invalid room member token
        "404":
          description: Room no longer exists
    put:
      operationId: syncMultiplayerSessionState
      tags: [multiplayer]
      summary: Update the current player's transform and synchronized objects
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z2-9]{6}$"
      security:
        - MultiplayerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiplayerStateUpdate"
      responses:
        "200":
          description: State accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiplayerSessionState"
        "400":
          description: Invalid state update
        "401":
          description: Invalid room member token
        "404":
          description: Room no longer exists
  /multiplayer/sessions/{code}/events:
    post:
      operationId: sendMultiplayerGameEvent
      tags: [multiplayer]
      summary: Send a small game event to everyone in the room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z2-9]{6}$"
      security:
        - MultiplayerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiplayerEventInput"
      responses:
        "201":
          description: Event sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiplayerGameEvent"
        "400":
          description: Invalid event
        "401":
          description: Invalid room member token
        "404":
          description: Room no longer exists
  /multiplayer/sessions/{code}/leave:
    post:
      operationId: leaveMultiplayerSession
      tags: [multiplayer]
      summary: Leave a multiplayer room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z2-9]{6}$"
      security:
        - MultiplayerSession: []
      responses:
        "204":
          description: Left room
        "401":
          description: Invalid room member token
        "404":
          description: Room no longer exists
components:
  securitySchemes:
    MultiplayerSession:
      type: http
      scheme: bearer
  schemas:
    MadBuilderInput:
      type: object
      required: [prompt, selectedName, assets]
      properties:
        prompt: { type: string, minLength: 3, maxLength: 2000 }
        selectedName: { type: string, maxLength: 80 }
        buildCategory:
          type: string
          enum: [auto, vehicle, house]
          description: Selected target type. Vehicle and house use their matching protected reference; auto follows the prompt.
        referenceImage:
          type: string
          maxLength: 1500000
          pattern: '^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$'
          description: Legacy single-image input. New clients should use referenceImages.
        referenceImages:
          type: array
          maxItems: 2
          description: Optional selected category reference and user-specific target, forwarded transiently to the vision planner.
          items: { $ref: "#/components/schemas/BuilderReferenceImage" }
        style:
          type: string
          enum: [polished-game-ready, realistic-game-ready, stylized-high-detail]
          description: Visual quality guidance for newly generated scene objects.
        assets:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/BuilderAsset" }
    BuilderAsset:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 160 }
        kind: { type: string, enum: [image, model] }
    MultiplayerPlayerInput:
      type: object
      required: [playerName]
      properties:
        playerName: { type: string, minLength: 1, maxLength: 32 }
    MultiplayerSessionMember:
      type: object
      required: [code, playerId, token, playerName, isHost]
      properties:
        code: { type: string, pattern: "^[A-Z2-9]{6}$" }
        playerId: { type: string, format: uuid }
        token: { type: string, minLength: 40, maxLength: 64 }
        playerName: { type: string, minLength: 1, maxLength: 32 }
        isHost: { type: boolean }
    MultiplayerVector3:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: -10000, maximum: 10000 }
        y: { type: number, minimum: -10000, maximum: 10000 }
        z: { type: number, minimum: -10000, maximum: 10000 }
    MultiplayerTransform:
      type: object
      required: [position, rotation, scale]
      properties:
        position: { $ref: "#/components/schemas/MultiplayerVector3" }
        rotation: { $ref: "#/components/schemas/MultiplayerVector3" }
        scale: { $ref: "#/components/schemas/MultiplayerVector3" }
    MultiplayerObjectState:
      type: object
      required: [entityId, transform]
      properties:
        entityId: { type: string, minLength: 1, maxLength: 100 }
        transform: { $ref: "#/components/schemas/MultiplayerTransform" }
    MultiplayerPlayerState:
      type: object
      required: [id, name, isHost, transform]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 32 }
        isHost: { type: boolean }
        transform:
          oneOf:
            - $ref: "#/components/schemas/MultiplayerTransform"
            - type: "null"
    MultiplayerGameEvent:
      type: object
      required: [sequence, playerName, name, payload, sentAt]
      properties:
        sequence: { type: integer, minimum: 1 }
        playerName: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 80 }
        payload: { type: string, maxLength: 300 }
        sentAt: { type: integer, minimum: 0 }
    MultiplayerEventInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        payload: { type: string, maxLength: 300 }
    MultiplayerStateUpdate:
      type: object
      required: [playerTransform, objects]
      properties:
        playerTransform:
          oneOf:
            - $ref: "#/components/schemas/MultiplayerTransform"
            - type: "null"
        objects:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/MultiplayerObjectState" }
    MultiplayerSessionState:
      type: object
      required: [code, players, objects, events]
      properties:
        code: { type: string, pattern: "^[A-Z2-9]{6}$" }
        players:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/MultiplayerPlayerState" }
        objects:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/MultiplayerObjectState" }
        events:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/MultiplayerGameEvent" }
    BuilderReferenceImage:
      type: object
      required: [role, dataUrl]
      properties:
        role:
          type: string
          enum: [global-style, category-default, user-target]
          description: global-style guides finish only; category-default anchors the selected Vehicle or House type; user-target is the specific object reference.
        dataUrl:
          type: string
          maxLength: 1500000
          pattern: '^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$'
    BuilderVector:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: -20, maximum: 20 }
        y: { type: number, minimum: -20, maximum: 20 }
        z: { type: number, minimum: -20, maximum: 20 }
    BuilderRotation:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: -180, maximum: 180 }
        y: { type: number, minimum: -180, maximum: 180 }
        z: { type: number, minimum: -180, maximum: 180 }
    BuilderSize:
      description: Local object size in scene units. Each dimension is bounded by the editor's safe scene limit.
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: 0.02, maximum: 100 }
        y: { type: number, minimum: 0.02, maximum: 100 }
        z: { type: number, minimum: 0.02, maximum: 100 }
    BuilderPart:
      type: object
      required: [key, parentKey, kind, name, position, rotation, size, color]
      properties:
        key: { type: string, minLength: 1, maxLength: 40 }
        parentKey: { type: [string, "null"], maxLength: 40 }
        kind:
          type: string
          enum: [group, box, plane, terrain, sprite, model, light, camera, ui-panel, ui-text, ui-button, ui-health, architecture, vehicle]
        shape:
          type: string
          enum: [cube, sphere, capsule, cylinder, cone, circle, ring, torus, torus-knot, icosahedron, dodecahedron, octahedron, tetrahedron, pyramid, triangular-prism, wedge, tube, hollow-cylinder, rounded-cube]
        name: { type: string, minLength: 1, maxLength: 80 }
        position: { $ref: "#/components/schemas/BuilderVector" }
        rotation: { $ref: "#/components/schemas/BuilderRotation" }
        size: { $ref: "#/components/schemas/BuilderSize" }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        opacity: { type: number, minimum: 0.05, maximum: 1 }
        assetId: { type: [string, "null"], maxLength: 80 }
        text: { type: string, maxLength: 80 }
        lightKind: { type: string, enum: [point, directional, ambient] }
        intensity: { type: number, minimum: 0, maximum: 50 }
        fov: { type: number, minimum: 10, maximum: 100 }
        architectureStyle:
          type: string
          enum: [victorian-house]
          description: Procedural house architecture preset expanded into editable scene geometry.
        vehicleStyle:
          type: string
          enum: [muscle-coupe]
          description: Contoured two-door coupe expanded locally into editable body, glazing, wheels and trim. Size is full width, height and length in meters.
        racingStripes:
          type: boolean
          description: Add paired longitudinal stripes only when visible in the vehicle reference.
        roofColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        trimColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    MadBuilderPlan:
      type: object
      required: [title, summary, warnings, parts]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        summary: { type: string, minLength: 1, maxLength: 800 }
        warnings:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 240 }
        parts:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/BuilderPart" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

