kind = "web"
previewPath = "/"
title = "Madhorse UI"
description = "A browser-based game engine workspace with a black, silver, and red interface and isolated, on-demand language runtimes."
version = "1.0.0"
id = "artifacts/madhorse-ui"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22277

[services.development]
run = "pnpm --filter @workspace/madhorse-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/madhorse-ui", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/madhorse-ui/server.mjs" ]

[services.env]
PORT = "22277"
BASE_PATH = "/"
