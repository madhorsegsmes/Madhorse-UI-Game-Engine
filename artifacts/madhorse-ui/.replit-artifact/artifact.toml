kind = "web"
previewPath = "/"
title = "Madhorse UI"
description = "A browser-based game engine workspace, beginning with a blank black, silver, and red interface shell inspired by the provided streaming-panel layout. Future steps will add simplified 2D and 3D game creation tools."
version = "1.0.0"
id = "artifacts/madhorse-ui"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22277

[services.development]
run = "pnpm --filter @workspace/madhorse-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/madhorse-ui", "run", "build" ]
serve = "static"
publicDir = "artifacts/madhorse-ui/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22277"
BASE_PATH = "/"
